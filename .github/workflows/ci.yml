name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Neovim config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.12.0

      - name: Show Neovim version
        run: nvim --version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ripgrep

      - name: Use this checkout as ~/.config/nvim
        run: |
          mkdir -p ~/.config
          ln -sfn "$GITHUB_WORKSPACE" ~/.config/nvim

      - name: Cache lazy.nvim plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim
            ~/.local/state/nvim
            ~/.cache/nvim
          key: ${{ runner.os }}-nvim-0.12.0-${{ hashFiles('lazy-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nvim-0.12.0-

      - name: Check Lua syntax
        run: nvim --clean -l scripts/check_lua.lua

      - name: Restore plugins and load the config
        run: nvim --headless "+Lazy! restore" "+luafile scripts/verify.lua" "+qa!"
